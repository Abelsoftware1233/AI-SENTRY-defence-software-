# nginx.conf — reverse proxy voor SENTRY AI Defense Console
#
# Dit bestand is een TEMPLATE. deploy.sh kopieert dit naar
# /etc/nginx/sites-available/ en vervangt __DOMAIN__ door de
# waarde die je bij het draaien van deploy.sh opgeeft.
#
# Plaatsing na deploy: /etc/nginx/sites-available/__DOMAIN__
# Activeren: symlink naar /etc/nginx/sites-enabled/ (doet deploy.sh voor je)
#
# ---------------------------------------------------------------
# OPTIONEEL — echte JA3 TLS-fingerprinting (zie server-middleware/
# tls_fingerprint.js voor de achtergrond).
#
# Stock nginx kan geen JA3-hash berekenen; dat vereist een build
# met de nginx-ja3-module (https://github.com/HouzuoGuo/nginx-ja3-module
# of vergelijkbaar) of een sidecar-proxy zoals go-ja3proxy die vóór
# nginx staat. Dat is een aparte nginx-compilatiestap die deploy.sh
# NIET automatisch voor je doet, omdat het een custom nginx-build
# vereist die niet via apt beschikbaar is.
#
# Zodra je zo'n module hebt gecompileerd, voeg je in dit bestand toe:
#   map $ssl_preread_ja3_hash $ja3_header { default $ssl_preread_ja3_hash; }
# en in de proxy_pass-blokken hieronder:
#   proxy_set_header X-JA3-Hash $ja3_header;
#
# Zonder die module blijft X-JA3-Hash simpelweg leeg, en valt
# tls_fingerprint.js netjes terug op "onbekend" (geen valse straf).
# ---------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Laat certbot / acme-challenge gewoon over http lopen
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    # Deze paden worden door certbot ingevuld/aangemaakt
    # (deploy.sh draait certbot --nginx voor je, indien gekozen).
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # Basale hardening headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Zelf ook een extra rate-limit-laag op nginx-niveau, los van de
    # applicatie-laag in FastAPI — verdediging in de diepte.
    limit_req_zone $binary_remote_addr zone=sentry_api:10m rate=10r/s;

    location /api/ {
        limit_req zone=sentry_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header X-JA3-Hash $ja3_header;  # activeer na ja3-module-install
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # proxy_set_header X-JA3-Hash $ja3_header;  # activeer na ja3-module-install
    }

    access_log /var/log/nginx/__DOMAIN___access.log;
    error_log  /var/log/nginx/__DOMAIN___error.log;
}
